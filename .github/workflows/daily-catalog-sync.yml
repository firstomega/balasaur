name: Daily catalog sync

# Grows + refreshes the Balasaur catalog once a day. It loops the apikey-gated sync
# endpoint a handful of short passes (each ~300 titles): `bucket` rotates which
# region's major-provider catalog is pulled (9 regions → 9 passes cover them all),
# and refreshExisting lets a pass re-pull stale popular titles once new ones run out.
# So the catalog climbs toward full coverage and streaming availability stays fresh.
#
# Verify runs in the repo's Actions tab.
# Requires a GitHub repository secret named SYNC_HOOK_SECRET (server-
# only key — never commit it to the repo). Add it under Settings → Secrets and
# variables → Actions.

on:
  schedule:
    # 08:00 UTC daily (low traffic). Cron is UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Manual "Run workflow" button, for on-demand top-ups. The backfill now runs on
    # every run automatically (see the Backfill step), so there's no input to tick.

# Don't let a slow run overlap the next day's run.
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # grow + refresh + full backfill catch-up can run long; under GitHub's 360 ceiling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger catalog sync
        env:
          BASE_URL: https://balasaur.com
          APIKEY: ${{ secrets.SYNC_HOOK_SECRET }}
        run: |
          if [ -z "$APIKEY" ]; then
            echo "::error::Missing repo secret SYNC_HOOK_SECRET"
            exit 1
          fi
          # Loop short passes instead of one long call the host would kill. bucket=i
          # rotates the provider-discovery region (9 passes = all 9 regions); each pass
          # also refreshes stale popular titles. ~9 × ~300 ≈ ~2.7k titles/day.
          # Derive the bucket from the day number so successive days CONTINUE the
          # rotation (72 region×provider combos → a full sweep every 8 days) instead
          # of re-running the same 9 combos every day.
          BASE=$(( $(date -u +%s) / 86400 * 9 ))
          total=0
          # One freshness value per successful pass, judged by the next step.
          : > /tmp/freshness.txt
          for i in $(seq 1 9); do
            bucket=$(( BASE + i ))
            echo "──────── sync pass $i/9 (bucket=$bucket) ────────"
            BODY=$(printf '{"bucket":%d,"refreshExisting":true}' "$bucket")
            HTTP=000
            for attempt in 1 2 3 4; do
              # On a timeout curl still prints "000" itself, so the fallback must add
              # nothing: the old `|| echo 000` made it "000000", which matched no
              # retry case, and a hung pass failed the night on its first attempt
              # (21 and 24 Oct).
              HTTP=$(curl -sS -o /tmp/sync.json -w "%{http_code}" \
                -X POST "$BASE_URL/api/public/hooks/sync-media" \
                -H "apikey: $APIKEY" -H "Content-Type: application/json" \
                --max-time 300 -d "$BODY" || true)
              HTTP=${HTTP:-000}
              [ "$HTTP" = "200" ] && break
              echo "pass $i attempt $attempt: HTTP $HTTP"; cat /tmp/sync.json 2>/dev/null; echo
              # 500 is retried here too: a pass is a set of upserts, so running it
              # again only redoes what did not land, and from 19 Oct a 500 meant
              # writes that gave up waiting for a database connection under scraper
              # load. A real bug still fails, after four attempts instead of one.
              case "$HTTP" in 500 | 502 | 503 | 504 | 429 | 000) ;; *) break ;; esac
              backoff=$((attempt * attempt * 5)); echo "retrying in ${backoff}s…"; sleep "$backoff"
            done
            echo "HTTP $HTTP"; echo "Response:"; cat /tmp/sync.json; echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::Sync pass $i failed with HTTP $HTTP (after retries)"
              exit 1
            fi
            jq -r '.catalogMaxUpdatedAt // "null"' /tmp/sync.json >> /tmp/freshness.txt 2>/dev/null || echo null >> /tmp/freshness.txt
            refreshed=$(jq -r '.refreshed // 0' /tmp/sync.json 2>/dev/null || echo 0)
            case "$refreshed" in '' | *[!0-9]*) refreshed=0 ;; esac
            total=$((total + refreshed))
            echo "pass $i: refreshed=$refreshed (cumulative=$total)"
            sleep 3
          done
          echo "Daily sync complete. Total titles enriched: $total"

      - name: Freshness canary (fail red if the catalog is stale)
        env:
          BASE_URL: https://balasaur.com
        run: |
          # Every sync pass reports the newest media.fetched_at after its writes
          # (the field is still called `catalogMaxUpdatedAt`). The newest value
          # across ALL passes is judged, not only the last pass's: on 1 to 4 Nov
          # every write landed, but the last pass's freshness read came back
          # null and the night went red. If no pass returned a value, or the
          # newest is older than 48h, writes are not landing: fail LOUDLY.
          # 2026-07/08 incident: upserts failed for five weeks while every nightly
          # run stayed green because per-chunk errors were only console.logged.
          set +e
          RESULT=$(bash .github/scripts/catalog-freshness.sh /tmp/freshness.txt 48)
          CODE=$?
          set -e
          echo "Freshness: $RESULT"
          if [ "$CODE" -eq 1 ]; then
            echo "::error::No sync pass returned a freshness value ($RESULT). Either the deployed app predates the canary or every freshness read failed. Redeploy from main and verify."
            exit 1
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Catalog is stale ($RESULT, limit 48h). Writes are not persisting. Check server env (APP_SUPABASE_*) and DB grants."
            exit 1
          fi

      # Runs even when an earlier step failed: a red freshness check used to
      # skip this step and the backfill, so a false alarm cost a night of
      # long-tail freshness. Only a cancelled run skips it.
      - name: Long-tail refresh (stalest titles, table-wide)
        if: ${{ !cancelled() }}
        env:
          BASE_URL: https://balasaur.com
          APIKEY: ${{ secrets.SYNC_HOOK_SECRET }}
        run: |
          # After the grow/popular passes above, refresh the STALEST titles table-wide
          # so the obscure long tail (which discovery never re-surfaces) also stays
          # current. The grow passes just bumped popular titles to fresh, so the oldest
          # rows are now the obscure ones — exactly what we want.
          # TEMPORARY CATCH-UP (2026-08): raised 5 → 30 passes (~9k titles/night).
          # The July data copy dropped raw_tmdb for ~57k rows, gutting facet/streaming
          # coverage; stalest-first means those rows re-fetch first, so this heals the
          # whole hole in roughly a week. Drop back to 5 once the backfill step below
          # reports missingRaw near 0.
          for i in $(seq 1 30); do
            echo "──────── refresh pass $i/30 ────────"
            HTTP=000
            for attempt in 1 2 3 4; do
              HTTP=$(curl -sS -o /tmp/refresh.json -w "%{http_code}" \
                -X POST "$BASE_URL/api/public/hooks/sync-media" \
                -H "apikey: $APIKEY" -H "Content-Type: application/json" \
                --max-time 300 -d '{"mode":"refresh"}' || true)
              HTTP=${HTTP:-000}
              [ "$HTTP" = "200" ] && break
              echo "pass $i attempt $attempt: HTTP $HTTP"; cat /tmp/refresh.json 2>/dev/null; echo
              # 500 is retried for the reason the sync step gives: a refresh pass
              # is a set of upserts, so a rerun only redoes what did not land.
              case "$HTTP" in 500 | 502 | 503 | 504 | 429 | 000) ;; *) break ;; esac
              backoff=$((attempt * attempt * 5)); echo "retrying in ${backoff}s…"; sleep "$backoff"
            done
            echo "HTTP $HTTP"; echo "Response:"; cat /tmp/refresh.json; echo
            if [ "$HTTP" != "200" ]; then
              # This used to be a warning, because the stalest-titles query sorted
              # the whole table and timed out under load. It now reads the
              # fetched_at index (3 ms), so a pass that still fails after four
              # attempts is a real failure and the night goes red. The backfill
              # and poster-colour steps below still run.
              echo "::error::Long-tail refresh pass $i failed with HTTP $HTTP (after retries). Remaining refresh passes skipped."
              exit 1
            fi
            refreshed=$(jq -r '.refreshed // 0' /tmp/refresh.json 2>/dev/null || echo 0)
            case "$refreshed" in '' | *[!0-9]*) refreshed=0 ;; esac
            echo "refresh pass $i: refreshed=$refreshed"
            [ "$refreshed" -eq 0 ] && { echo "Nothing left to refresh."; break; }
            sleep 3
          done

      - name: Backfill facets + derivations (automatic, resumable)
        if: ${{ !cancelled() }}
        env:
          BASE_URL: https://balasaur.com
          APIKEY: ${{ secrets.SYNC_HOOK_SECRET }}
        run: |
          # Re-derive genres/origins/streaming/awards + the advanced-filter facets
          # (sub-genres, themes, audience, film length, series status) from already-stored
          # raw_tmdb/raw_omdb — NO external API calls. Runs on EVERY nightly run so facet
          # coverage tops up with zero manual clicks (new titles are tagged at ingest; this
          # catches the historical long tail and re-derives when the taxonomy changes).
          #
          # Resumable: each call rewrites rows for ~90s then returns a lastId cursor + done
          # flag; we thread lastId back as `after`, so one run walks the whole catalog via
          # many short calls (none long enough to hit a host/statement timeout). skip-unchanged
          # makes converged runs cheap (no rewrites). A stuck page (transient read timeout) is
          # retried, and any failure is a non-fatal warning: it resumes next run, and the
          # sync, freshness and refresh steps above decide whether the night is red.
          # Wall-clock budget (2026-07-02 incident): an unbounded converge run once made
          # 58 back-to-back passes (~97 min of sustained reads + ~60k row updates) and
          # took the Cloud DB down with it — the site was dark for hours. Cap the nightly
          # backfill work instead: it's resumable, so a capped run just continues the next
          # night. A longer inter-pass sleep gives the DB recovery windows in between.
          BUDGET_SECONDS=1200
          START=$(date +%s)
          AFTER=""
          stuck=0
          for i in $(seq 1 200); do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$BUDGET_SECONDS" ]; then
              echo "::warning::Backfill time budget (${BUDGET_SECONDS}s) reached after $((i-1)) passes — stopping for tonight; resumes next run."
              break
            fi
            echo "──────── backfill pass $i (after='${AFTER}', elapsed=${ELAPSED}s) ────────"
            BODY=$(jq -nc --arg a "$AFTER" '{after:$a, onlyMissing:true}')
            HTTP=000
            for attempt in 1 2 3 4; do
              HTTP=$(curl -sS -o /tmp/bf.json -w "%{http_code}" \
                -X POST "$BASE_URL/api/public/hooks/backfill-media" \
                -H "apikey: $APIKEY" -H "Content-Type: application/json" \
                --max-time 150 -d "$BODY" || true)
              HTTP=${HTTP:-000}
              [ "$HTTP" = "200" ] && break
              echo "pass $i attempt $attempt: HTTP $HTTP"; cat /tmp/bf.json 2>/dev/null; echo
              case "$HTTP" in 502 | 503 | 504 | 429 | 000) ;; *) break ;; esac
              backoff=$((attempt * attempt * 5)); echo "retrying in ${backoff}s…"; sleep "$backoff"
            done
            if [ "$HTTP" != "200" ]; then
              echo "::warning::Backfill pass $i returned HTTP $HTTP — stopping backfill for this run (non-fatal; resumes next run)."
              break
            fi
            echo "$(jq -c '{scanned,stamped,missingRaw,updatedFacets,updatedGenres,updatedStreaming,updatedAwards,failed,done,lastId}' /tmp/bf.json 2>/dev/null || cat /tmp/bf.json)"
            DONE=$(jq -r '.done // false' /tmp/bf.json 2>/dev/null || echo false)
            NEXT=$(jq -r '.lastId // empty' /tmp/bf.json 2>/dev/null || true)
            if [ "$DONE" = "true" ]; then echo "✅ Backfill complete after pass $i."; break; fi
            if [ -z "$NEXT" ]; then echo "No cursor returned — stopping at pass $i."; break; fi
            # Cursor didn't advance: usually a transient blip. Retry the SAME cursor a few
            # times before giving up, so one hiccup can't end the whole run.
            if [ "$NEXT" = "$AFTER" ]; then
              stuck=$((stuck + 1))
              if [ "$stuck" -ge 10 ]; then
                echo "::warning::Stuck at '${AFTER}' for $stuck passes — stopping backfill."; break
              fi
              echo "No advance (stuck $stuck/10) — retrying same cursor…"; sleep $((stuck * 5)); continue
            fi
            stuck=0; AFTER="$NEXT"; sleep 10
          done

      # Poster colours: two hex values per title, read out of the poster's own
      # JPEG block averages on the server, used for the ambient glow behind a
      # detail page and for the tiles on a shared Taste Card. Without this the
      # glow renders nothing at all, so it runs on every nightly pass.
      #
      # Drains oldest-unread first through the same apikey-gated endpoint the
      # steps above use. Capped in wall clock rather than by row count, for the
      # reason the backfill step documents: this is resumable, so a capped run
      # simply continues tomorrow. 87,701 titles have a poster; the popular few
      # thousand that carry real traffic fill in on the first couple of nights,
      # because the endpoint claims rows by popularity.
      - name: Poster colours
        if: always()
        env:
          BASE_URL: https://balasaur.com
          APIKEY: ${{ secrets.SYNC_HOOK_SECRET }}
        run: |
          if [ -z "$APIKEY" ]; then
            echo "::warning::Missing repo secret SYNC_HOOK_SECRET — skipping poster colours."
            exit 0
          fi
          BUDGET_SECONDS=600
          START=$(date +%s)
          TOTAL_STORED=0
          for i in $(seq 1 40); do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$BUDGET_SECONDS" ]; then
              echo "::notice::Poster-colour budget (${BUDGET_SECONDS}s) reached after $((i-1)) passes — resumes next run."
              break
            fi
            HTTP=$(curl -sS -o /tmp/pc.json -w "%{http_code}" \
              -X POST "$BASE_URL/api/public/hooks/sync-media" \
              -H "apikey: $APIKEY" -H "Content-Type: application/json" \
              --max-time 120 -d '{"mode":"posterColors","limit":400,"timeBudgetMs":60000}' || true)
            if [ "$HTTP" != "200" ]; then
              echo "::warning::Poster-colour pass $i returned HTTP $HTTP — stopping (non-fatal, resumes next run)."
              cat /tmp/pc.json 2>/dev/null; echo
              break
            fi
            echo "$(jq -c '{scanned,stored,noColor,failed,remaining}' /tmp/pc.json 2>/dev/null || cat /tmp/pc.json)"
            SCANNED=$(jq -r '.scanned // 0' /tmp/pc.json 2>/dev/null || echo 0)
            STORED=$(jq -r '.stored // 0' /tmp/pc.json 2>/dev/null || echo 0)
            NOCOLOR=$(jq -r '.noColor // 0' /tmp/pc.json 2>/dev/null || echo 0)
            REMAINING=$(jq -r '.remaining // 0' /tmp/pc.json 2>/dev/null || echo 0)
            TOTAL_STORED=$(( TOTAL_STORED + STORED ))
            if [ "$REMAINING" = "0" ]; then echo "✅ Poster colours complete after pass $i."; break; fi
            # Stop on rows claimed, not colours stored: a pass of posters that
            # were read but hold no colour still moves the queue forward, so it
            # must not end the night.
            if [ "$SCANNED" = "0" ]; then
              echo "::warning::Pass $i claimed no titles with $REMAINING reported left — stopping for tonight."; break
            fi
            # Every claimed title failed to download or to write, so the same
            # titles would be claimed again next pass; stop rather than spin.
            if [ $(( STORED + NOCOLOR )) -eq 0 ]; then
              echo "::warning::Pass $i read none of its $SCANNED titles — stopping for tonight."; break
            fi
            sleep 5
          done
          echo "::notice::Poster colours: stored $TOTAL_STORED this run."
